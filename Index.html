<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>studio Ghibli</title>
    <link rel="stylesheet" href="src/css/estilo.css">
</head>

<body background="src/img/background.png">
    <header>
        <div class="cabecalho">
            <figure>
                <img src="src/img/ghibli_logo.png"
                    alt="A logo do Studio Ghibli apresenta a silhueta de Totoro ao lado do nome do estúdio em japonês">
            </figure>

            <div class="icones">
                <button> <a href="https://google.com" target="_blank"><img src="src/img/google.png"
                            alt="Logo da Google com a borda branca e o fundo transparente"></a>
                </button>

                <button> <a href="https://www.facebook.com/?locale=pt_BR" target="_blank"><img src="src/img/facebook.png"
                            alt="Logo do Facebook com a borda branca e o fundo transparente"></a>
                </button>

                <button> <a href="https://x.com/?lang=pt" target="_blank"><img src="src/img/twitter.png"
                            alt="Logo do X (Antigo Twitter) com a borda branca e o fundo transparente"></a>
                </button>

                <button> <a href="https://www.instagram.com/" target="_blank"><img src="src/img/instagram.png"
                            alt="Logo do Instagram com a borda branca e o fundo transparente"></a>
                </button>
            </div>
    </header>

    <main>
        <div class="conteudo_principal">

            <div class="textos">
                <h5>Hayao Miyazaki</h5>
                <h1>A viagem de Chihiro</h1>
                <p>Chihiro chega a um mundo mágico dominado por uma bruxa. Aqueles que desobedecem são transformados em
                    animais.</p>

                <div class="botoes">

                    <button class="btnrosa"><img src="src/img/play.png" alt="icone branco do play "> Assistir
                        agora</button>

                    <button class="btnt">Assista o trailer</button>
                </div>
            </div>

            <figure class="fantasma">
                <img src="src/img/fantasma.png"
                    alt="Mostra dois espíritos brancos flutuantes de A Viagem de Chihiro, com formas arredondadas, olhos pequenos e expressões misteriosas enquanto cochicham">
            </figure>
        </div>
    </main>
</body>

</html>
